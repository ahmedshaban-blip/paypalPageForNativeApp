<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PayPal Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- PayPal JS SDK -->
    <script
        src="https://www.paypal.com/sdk/js?client-id=ASMNSon_EWlL012WLGlpjgxbt6mdFWLDxgM1G2CqXszk13KJ66774zXDj0mnIiIwHYsct9URNS8tSWkW&currency=USD"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        #paypal-button-container {
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div id="paypal-button-container"></div>

    <script>
        // 🟦 1) اقرأ السعر من الـ URL: ?amount=49.99
        const params = new URLSearchParams(window.location.search);
        const amountFromQuery = parseFloat(params.get("amount"));
        const amount = isNaN(amountFromQuery) ? 10 : amountFromQuery; // لو مش مبعوت → 10

        console.log("Amount from URL:", amount);

        // 🟦 2) function تبعت message للأب (React Native WebView أو iframe)
        function sendMessageToApp(data) {
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                // جوّه WebView في React Native
                window.ReactNativeWebView.postMessage(JSON.stringify(data));
            } else {
                // لو بتجرب في المتصفح عادي (مثلاً مع iframe)
                window.parent.postMessage(data, "*");
            }
        }

        // 🟦 3) PayPal Buttons
        paypal
            .Buttons({
                createOrder: function (data, actions) {
                    return actions.order.create({
                        purchase_units: [
                            {
                                amount: {
                                    value: amount.toFixed(2), // هنا بنستخدم السعر من الـ URL
                                },
                            },
                        ],
                    });
                },

                onApprove: function (data, actions) {
                    return actions.order.capture().then(function (details) {
                        sendMessageToApp({
                            status: "success",
                            details: details, // دي اللي هتوصل للـ WebView
                        });
                    });
                },

                onCancel: function (data) {
                    sendMessageToApp({
                        status: "cancel",
                    });
                },

                onError: function (err) {
                    console.error(err);
                    sendMessageToApp({
                        status: "error",
                        message: err && err.toString(),
                    });
                },
            })
            .render("#paypal-button-container");
    </script>
</body>

</html>
