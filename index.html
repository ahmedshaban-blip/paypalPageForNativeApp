<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Checkout</title>
    <script src="https://www.paypal.com/sdk/js?client-id=ASMNSon_EWlL012WLGlpjgxbt6mdFWLDxgM1G2CqXszk13KJ66774zXDj0mnIiIwHYsct9URNS8tSWkW&currency=USD&enable-funding=card"></script>
    <style>
        /* إعدادات الخطوط والأساسيات */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center; /* توسيط عمودي وأفقي */
        }

        /* تصميم الكارت الأساسي */
        .payment-card {
            background-color: #ffffff;
            width: 92%; /* جعل العرض يأخذ 92% من عرض الموبايل */
            max-width: 500px; /* أقصى عرض للشاشات الكبيرة */
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); /* ظل ناعم وكبير */
            text-align: center;
            position: relative;
        }

        /* أيقونة المتجر أو السلة */
        .icon-container {
            width: 60px;
            height: 60px;
            background-color: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
        
        .icon-container svg {
            color: #4f46e5; /* لون مميز للأيقونة */
        }

        /* النصوص */
        .title {
            color: #1f2937;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* منطقة السعر */
        .price-container {
            background-color: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e5e7eb;
        }

        .price-label {
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .price-value {
            color: #111827;
            font-size: 36px;
            font-weight: 800;
        }

        /* التحميل */
        #loader {
            padding: 20px;
            color: #6b7280;
            font-size: 14px;
        }
        
        .hidden { display: none; }

    </style>
</head>

<body>

    <div class="payment-card">
        <div class="icon-container">
            <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
        </div>

        <div class="title">Complete Payment</div>
        <div class="subtitle">Order ID #82301</div>

        <div class="price-container">
            <div class="price-label">Total to pay</div>
            <div class="price-value">$10.00</div>
        </div>

        <div id="loader">Securely loading options...</div>
        <div id="paypal-button-container" class="hidden"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loader = document.getElementById("loader");
            const container = document.getElementById("paypal-button-container");

            if (typeof paypal === "undefined") {
                loader.innerText = "Error loading PayPal.";
                return;
            }

            paypal.Buttons({
                style: {
                    layout: "vertical",
                    color: "black",   // اللون الأسود يعطي طابع فخامة أكثر (اختياري)
                    shape: "rect",    // أزرار مستطيلة بحواف ناعمة
                    label: "pay",
                    height: 50        // زيادة ارتفاع الزر لسهولة الضغط
                },
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: "10.00" } }]
                    });
                },
                onInit: () => {
                    loader.classList.add("hidden");
                    container.classList.remove("hidden");
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then((details) => {
                        if(window.ReactNativeWebView) {
                            window.ReactNativeWebView.postMessage(JSON.stringify({ status: "success", details }));
                        }
                    });
                },
                onError: (err) => {
                    if(window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify({ status: "error", message: err.toString() }));
                    }
                }
            }).render("#paypal-button-container");
        });
    </script>
</body>
</html>
