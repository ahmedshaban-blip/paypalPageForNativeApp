<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PayPal Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script
        src="https://www.paypal.com/sdk/js?client-id=ASMNSon_EWlL012WLGlpjgxbt6mdFWLDxgM1G2CqXszk13KJ66774zXDj0mnIiIwHYsct9URNS8tSWkW&currency=USD"></script>

    <style>
        /* إعدادات الصفحة الأساسية */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* خلفية متدرجة هادئة */
            background: linear-gradient(135deg, #f6f8fd 0%, #eceff8 100%);
            padding: 20px;
            box-sizing: border-box;
        }

        /* تصميم الكارت الرئيسي */
        .checkout-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px; /* عرض مناسب للموبايل */
            border-radius: 24px; /* حواف دائرية كبيرة */
            /* ظل ناعم يعطي إحساس بالطفو */
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* رأس الكارت */
        .card-header h1 {
            margin: 0;
            color: #1a1f36;
            font-size: 24px;
            font-weight: 700;
        }

        .card-header p {
            margin: 10px 0 35px 0;
            color: #697386;
            font-size: 15px;
        }

        /* حاوية أزرار بايبال */
        /**
         * Creates an order on PayPal with the given amount.
         * @param {Object} data - Unused.
         * @param {Object} actions - Actions object provided by PayPal.
         * @returns {Promise} A promise that resolves with the created order.
         */
        #paypal-button-container {
            width: 100%;
            margin: 0 auto;
        }
        
        /* شريط الثقة السفلي */
        .trust-badge {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8792a2;
            font-size: 13px;
            font-weight: 500;
        }
        
        .trust-badge svg {
            margin-right: 8px;
            color: #3c4257;
        }

        /* تحسينات للشاشات الصغيرة جداً */
        @media (max-width: 360px) {
            .checkout-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="checkout-card">
        <div class="card-header">
            <h1>Complete Payment</h1>
            <p>Choose your preferred payment method below.</p>
        </div>

        <div id="paypal-button-container"></div>

        <div class="trust-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Secure & Encrypted Transaction
        </div>
    </div>


    <script>
        // 🟦 1) اقرأ السعر من الـ URL: ?amount=49.99
        const params = new URLSearchParams(window.location.search);
        const amountFromQuery = parseFloat(params.get("amount"));
        const amount = isNaN(amountFromQuery) ? 10 : amountFromQuery; // لو مش مبعوت → 10

        console.log("Amount from URL:", amount);

        // 🟦 2) function تبعت message للأب (React Native WebView أو iframe)
        function sendMessageToApp(data) {
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                // جوّه WebView في React Native
                window.ReactNativeWebView.postMessage(JSON.stringify(data));
            } else {
                // لو بتجرب في المتصفح عادي (مثلاً مع iframe)
                window.parent.postMessage(data, "*");
            }
        }

        // 🟦 3) PayPal Buttons
        paypal
            .Buttons({
                // 🎨 STYLE SECTION: هذا الجزء فقط تم تعديله لتحسين شكل الأزرار
                style: {
                    layout: 'vertical',
                    color:  'gold',    // لون ذهبي فخم
                    shape:  'rect',    // شكل مستطيل بحواف ناعمة (افتراضي من بايبال)
                    label:  'pay', 
                    height: 54         // زيادة ارتفاع الزر ليكون أسهل في الضغط على الموبايل
                },
                // نهاية تعديلات الستايل

                createOrder: function (data, actions) {
                    return actions.order.create({
                        purchase_units: [
                            {
                                amount: {
                                    value: amount.toFixed(2), // هنا بنستخدم السعر من الـ URL
                                },
                            },
                        ],
                    });
                },

                onApprove: function (data, actions) {
                    return actions.order.capture().then(function (details) {
                        sendMessageToApp({
                            status: "success",
                            details: details, // دي اللي هتوصل للـ WebView
                        });
                    });
                },

                onCancel: function (data) {
                    sendMessageToApp({
                        status: "cancel",
                    });
                },

                onError: function (err) {
                    console.error(err);
                    sendMessageToApp({
                        status: "error",
                        message: err && err.toString(),
                    });
                },
            })
            .render("#paypal-button-container");
    </script>
</body>

</html>
